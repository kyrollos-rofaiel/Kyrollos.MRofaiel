<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#131e3a"/>
      <stop offset="70%" stop-color="#090d1a"/>
      <stop offset="100%" stop-color="#04060d"/>
    </radialGradient>

    <!-- Tech Brand Gradient (Scarface) -->
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>

    <!-- Finance Brand Gradient (Kyrollos) -->
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  
  <!-- Glowing Border -->
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#techGrad)" stroke-width="8" opacity="0.8"/>

  <!-- Circuit nodes in background -->
  <g opacity="0.35" stroke="#00f2fe" stroke-width="4" fill="none">
    <path d="M 64 256 H 140 L 180 180"/>
    <circle cx="180" cy="180" r="8" fill="#00f2fe"/>
    <path d="M 448 256 H 372 L 332 332"/>
    <circle cx="332" cy="332" r="8" fill="#10b981"/>
    <circle cx="256" cy="70" r="6" fill="#4facfe"/>
    <path d="M 256 70 V 120"/>
  </g>

  <!-- Stylized Monogram: "S" (Scarface) & "K" (Kyrollos) Intertwined -->
  <g filter="url(#neonGlow)">
    <!-- Tech 'S' Stream -->
    <path d="M 330 155 C 330 120 290 105 245 105 C 190 105 155 135 155 180 C 155 240 230 245 285 265 C 340 285 365 315 365 360 C 365 425 295 445 235 445 C 175 445 135 410 135 365" 
          fill="none" 
          stroke="url(#techGrad)" 
          stroke-width="38" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Finance 'K' Backbone & Precision Slash -->
    <path d="M 195 140 V 390" 
          fill="none" 
          stroke="url(#finGrad)" 
          stroke-width="34" 
          stroke-linecap="round" 
          opacity="0.95"/>

    <path d="M 315 190 L 220 270 L 330 385" 
          fill="none" 
          stroke="url(#finGrad)" 
          stroke-width="34" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.95"/>
  </g>

  <!-- Central Fusion Energy Spark -->
  <circle cx="256" cy="265" r="12" fill="#ffffff" filter="url(#neonGlow)"/>
  <circle cx="256" cy="265" r="6" fill="#00f2fe"/>
</svg>
